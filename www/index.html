<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flotilla: coming soon</title>
<meta name="description" content="Flotilla is coming soon.">
<link rel="canonical" href="https://useflotilla.com/">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFAFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1322" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #FCFAFD;
  --text: #311E36;
  --muted: #6C5C73;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1D1322;
    --text: #F1E9F4;
    --muted: #A898AE;
  }
}
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { padding: 24px; text-align: center; }
svg { display: block; margin: 0 auto 20px; }
h1 {
  margin: 0;
  font: 600 2rem/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  letter-spacing: -0.01em;
}
p { margin: 8px 0 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 28 11" width="84" height="33" shape-rendering="crispEdges" aria-hidden="true">
    <defs>
      <path id="sail" d="M2 0h1v1h1v1h1v1h1v1h1v1h1v1H2z"/>
      <path id="hull" d="M0 7h8v2H0z"/>
    </defs>
    <g fill="#F37173" transform="translate(0 2)"><use href="#sail"/><use href="#hull"/></g>
    <g fill="#F6BC63" transform="translate(10 0)"><use href="#sail"/><use href="#hull"/></g>
    <g fill="#C2A7E2" transform="translate(20 2)"><use href="#sail"/><use href="#hull"/></g>
  </svg>
  <h1>Flotilla</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
