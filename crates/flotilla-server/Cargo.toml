[package]
name = "flotilla-server"
description = "Flotilla's server: the engine's host for any number of clients, over a WebSocket"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flotilla-proto.workspace = true
flotilla-core.workspace = true
flotilla-engine.workspace = true
flotilla-client.workspace = true
flotilla-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
base64.workspace = true
getrandom = "0.3"
subtle = "2.6"
tokio.workspace = true
futures-util.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
chrono.workspace = true
tokio-tungstenite.workspace = true
