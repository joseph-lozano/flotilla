flotilla-engine.workspace = true
flotilla-server.workspace = true
flotilla-client.workspace = true
flotilla-mcp.workspace = true
uuid.workspace = true
clap.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
qrcode = { version = "0.14", default-features = false }
