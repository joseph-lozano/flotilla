[package]
name = "flotilla-client"
description = "Flotilla's client: a connection to a server, and a copy of the views it subscribes to"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flotilla-proto.workspace = true
flotilla-model.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"

# Device tokens off a Mac are files in the config folder (`tokens`).
[target.'cfg(not(target_os = "macos"))'.dependencies]
dirs.workspace = true
